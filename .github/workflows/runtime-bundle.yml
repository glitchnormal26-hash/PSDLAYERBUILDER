name: Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - name: Pack runnable bundle
        run: tar -czf psdlayerbuilder-runtime.tgz dist node_modules package.json package-lock.json uxp-finalizer
      - uses: actions/upload-artifact@v4
        with:
          name: psdlayerbuilder-runtime
          path: psdlayerbuilder-runtime.tgz
          compression-level: 0
          retention-days: 1
